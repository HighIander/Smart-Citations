<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenAlex impact preview</title>
  <link rel="stylesheet" href="content.css">
  <style>
    body { margin: 0; padding: 28px; background: #eef2f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .preview { box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr); width: 460px; height: 720px; overflow: hidden; background: white; border: 1px solid #d0d7de; }
    .detail { overflow: auto; padding: 18px; color: #57606a; font-size: 13px; }
    .detail-filler { height: 900px; background: linear-gradient(#fff, #f6f8fa); }
  </style>
  <script>
    window.chrome = {
      runtime: {
        sendMessage: async (message) => message.type === "ctca-openalex-author-impact" ? {
          ok: true,
          profile: {
            id: "https://openalex.org/A5023888391",
            displayName: "Ada Lovelace",
            orcid: "https://orcid.org/0000-0001-2345-6789",
            worksCount: 64,
            citedByCount: 1842,
            summaryStats: { hIndex: 23, i10Index: 37, twoYearMeanCitedness: 3.18 },
            countsByYear: [
              { year: 2017, citedByCount: 3 }, { year: 2018, citedByCount: 11 },
              { year: 2019, citedByCount: 26 }, { year: 2020, citedByCount: 58 },
              { year: 2021, citedByCount: 94 }, { year: 2022, citedByCount: 173 },
              { year: 2023, citedByCount: 238 }, { year: 2024, citedByCount: 306 },
              { year: 2025, citedByCount: 344 }, { year: 2026, citedByCount: 219 }
            ],
            fetchedDate: "2026-07-30",
            matchSource: "references",
            matchCount: 8
          }
        } : { ok: true, results: [] },
        openOptionsPage() {}
      }
    };
  </script>
  <script src="openalex.js"></script>
</head>
<body>
  <main class="preview ctca-manager-details-column ctca-openalex-impact-visible">
    <div id="impact" class="ctca-openalex-impact-slot"></div>
    <div class="detail"><strong>Entry details</strong><p>The selected reference details scroll independently below the separate author-impact box.</p><div class="detail-filler"></div></div>
  </main>
  <script>
    const impact = document.querySelector("#impact");
    impact.innerHTML = SmartCitationsOpenAlex.impactPlaceholderHtml();
    SmartCitationsOpenAlex.hydrateAuthorImpact(
      impact.querySelector(".ctca-openalex-impact"),
      [{ identity: "doi:10.1000/example", doi: "10.1000/example", title: "Example", year: "2020", authors: "Ada Lovelace" }],
      "Ada Lovelace"
    );
  </script>
</body>
</html>
